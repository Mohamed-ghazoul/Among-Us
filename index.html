function route(p,tx,ty){
  const links=[
    [1,0,0],[0,2,1],[1,3,2],[0,4,3],[2,5,4],
    [3,4,5],[4,5,6],[4,6,7],[5,7,8],[6,7,9]
  ];
  const nodes=[
    {x:540,y:250},{x:1180,y:250},{x:265,y:500},{x:860,y:450},
    {x:1460,y:500},{x:555,y:760},{x:1180,y:760},{x:815,y:925},
    {x:1460,y:955},{x:1110,y:1125}
  ].map(q=>({x:q.x*SCALE,y:q.y*SCALE}));
  const roomOf=(x,y)=>ROOM.findIndex(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h);
  const a=roomOf(p.x,p.y),b=roomOf(tx,ty);if(a<0||b<0||a===b)return [{x:tx,y:ty}];

  links.forEach(([u,v,node])=>{adj[u].push({to:v,node});adj[v].push({to:u,node})});
  const queue=[a],prev=new Map([[a,null]]);
  while(queue.length&&!prev.has(b)){const u=queue.shift();for(const e of adj[u])if(!prev.has(e.to)){prev.set(e.to,{from:u,node:e.node});queue.push(e.to)}}

  const path=[];let cur=b;while(cur!==a){const step=prev.get(cur);path.push(nodes[step.node]);cur=step.from}path.reverse();path.push({x:tx,y:ty});return path;

  const nk=ok&&role==='i'?cr.filter(o=>dist(my,o)<70)[0]:null;
  const nb=ok?G.bodies.filter(o=>dist(my,o)<90)[0]:null;
  const ns=ok?ST.map((s,i)=>({i,x:s[0],y:s[1]})).filter(s=>!G.done.has(s.i)&&dist(my,s)<55)[0]:null;
  const nt=ok&&!G.emUsed&&dist(my,{x:865*SCALE,y:710*SCALE})<75;

  bk.textContent=Date.now()<killCd?'قتل ('+Math.ceil((killCd-Date.now())/1000)+')':'قتل';

  br.onclick=()=>{if(!nb)G.emUsed=true;R.emit('meet',{})};

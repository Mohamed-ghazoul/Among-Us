<style>

<script>
const COL=['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1','#f06292','#8d6e63','#cfd8dc','#7cb342','#5e35b1'];
const D=[254,690,1120,1552],CY=500,RX=[[40,468],[484,898],[914,1328],[1344,1760]],RY=[[40,340],[660,960]];
const ST=[];RY.forEach(r=>RX.forEach(c=>{ST.push([c[0]+85,r[0]+70],[c[1]-85,r[0]+70],[c[0]+85,r[1]-70],[c[1]-85,r[1]-70])}));
const TY=ST.map((_,i)=>i%12);
const WL=[[24,24,1752,16],[24,960,1752,16],[24,24,16,952],[1760,24,16,952],[468,40,16,300],[898,40,16,300],[1328,40,16,300],[468,660,16,300],[898,660,16,300],[1328,660,16,300]];
[340,644].forEach(y=>{let x=40;D.forEach(d=>{WL.push([x,y,d-50-x,16]);x=d+50});WL.push([x,y,1760-x,16])});
const RC=[];RY.forEach(r=>RX.forEach(c=>RC.push([(c[0]+c[1])/2,(r[0]+r[1])/2,c[0],r[0],c[1]-c[0],r[1]-r[0]])));
const RN=['المحرك','الإدارة','المخزن','المختبر','الكهرباء','الأمان','الملاحة','الطبية'];
const FL=RC.map((r,i)=>[r[2],r[3],r[4],r[5],RN[i]]);FL.push([40,356,1720,288,'']);
const STARS=Array.from({length:220},()=>[Math.random()*2300-250,Math.random()*1500-250,Math.random()*1.8+.5]);
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),ov=document.getElementById('ov');
const $=id=>document.getElementById(id);
let R=null,peers=[],G=null,joined=false,my={x:900,y:500},nick='',killCd=0,BOTS=[],soloRole='c',ptr=null;const K={};let VW=800,VH=500,Z=1;const joy={x:0,y:0};let shake=0,flash=0,mute=false,AC=null,sabCd=0,darkCd=0,soloN=6;const FX=[];const LP={};
function snd(f,d,t,v){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={task:()=>{snd(660,.12);setTimeout(()=>snd(880,.18),110)},kill:()=>snd(110,.4,'sawtooth',.15),meet:()=>[500,400,500,400].forEach((f,k)=>setTimeout(()=>snd(f,.2,'square',.07),k*220)),win:()=>[523,659,784,1046].forEach((f,k)=>setTimeout(()=>snd(f,.25),k*150)),lose:()=>[400,330,260,200].forEach((f,k)=>setTimeout(()=>snd(f,.3,'sawtooth',.08),k*200))};
sfx.sab=()=>snd(180,.35,'square',.1);
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.display='none'},3000)}
function sprite(x,y,c,f,w){
  cx.save();cx.translate(x,y);cx.scale(f,1);const s=Math.sin(w)*5;
  cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(0,18,14,5,0,0,6.283);cx.fill();
  cx.fillStyle=c;cx.fillRect(-19,-7,8,16);cx.fillStyle='rgba(0,0,0,.28)';cx.fillRect(-19,-7,8,16);
  cx.fillStyle=c;cx.fillRect(-10,8,8,9+s*.6);cx.fillRect(2,8,8,9-s*.6);
  cx.beginPath();cx.ellipse(0,-2,13,16,0,0,6.283);cx.fill();cx.strokeStyle='rgba(0,0,0,.35)';cx.lineWidth=2;cx.stroke();
  cx.fillStyle='#bfe6ff';cx.beginPath();cx.ellipse(5,-7,8,5.5,0,0,6.283);cx.fill();
  cx.fillStyle='rgba(255,255,255,.75)';cx.beginPath();cx.ellipse(8,-9,3,1.8,0,0,6.283);cx.fill();
  cx.restore();
}
function hud2(){
  if(flash>.02){cx.fillStyle='rgba(255,40,60,'+flash*.45+')';cx.fillRect(0,0,VW,VH);flash*=.93}
  const k=.066,mx=VW-1800*k-14,y0=10;cx.fillStyle='rgba(8,12,28,.78)';cx.fillRect(mx-4,y0-4,1800*k+8,1000*k+8);
  FL.forEach(f=>{cx.fillStyle='#2a3566';cx.fillRect(mx+f[0]*k,y0+f[1]*k,f[2]*k,f[3]*k)});
  ST.forEach((t,i)=>{cx.fillStyle=G.done.has(i)?'#3ddc97':'#ffb020';cx.fillRect(mx+t[0]*k-2,y0+t[1]*k-2,4,4)});
  cx.fillStyle='#fff';cx.beginPath();cx.arc(mx+my.x*k,y0+my.y*k,3.5,0,6.283);cx.fill();
}
function h(t,txt,cls,fn){const e=document.createElement(t);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;if(fn)e.onclick=fn;return e}
const me=()=>peers.find(p=>p.isMe&&p.sameTab);
const myId=()=>{const m=me();return m&&m.peer};
const named=()=>peers.filter(p=>p.presence&&p.presence.n);
const P=id=>peers.find(p=>p.peer===id);
const nm=id=>{const p=P(id);return p?p.presence.n:'؟'};
const colr=id=>{const p=P(id);return COL[(p&&p.presence.c)||0]};
const pos=id=>{const p=P(id);return p?{x:p.presence.x||900,y:p.presence.y||500}:null};
const alive=()=>G?Object.keys(G.roles).filter(p=>!G.dead.has(p)&&P(p)):[];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function col(o,r){WL.forEach(([x,y,w,hh])=>{const px=Math.max(x,Math.min(o.x,x+w)),py=Math.max(y,Math.min(o.y,y+hh)),dx=o.x-px,dy=o.y-py,d=Math.hypot(dx,dy);if(d<r){if(!d){o.y-=r}else{o.x+=dx/d*(r-d);o.y+=dy/d*(r-d)}}})}

function localNet(n){
  const H={ev:{},pc:[]},ps=[{peer:'me',isMe:true,sameTab:true,presence:{n:nick||'أنت',c:0,x:900,y:500}}];
  ['سمير','ليلى','هادي','نور','كرم','رنا','عمر','سلمى','يوسف','دانا','زياد'].slice(0,n-1).forEach((nn,i)=>ps.push({peer:'b'+i,isMe:false,sameTab:false,presence:{n:nn,c:i+1,x:900,y:500}}));
  const fire=(t,d,from)=>(H.ev[t]||[]).forEach(f=>f({topic:t,data:d,peer:from,isMe:from==='me',sameTab:from==='me'}));
  return{n,isHost:true,local:true,ps,fire,on:(t,f)=>{(H.ev[t]=H.ev[t]||[]).push(f)},onPeers:f=>f({peers:ps,joined:[],left:[],updated:[]}),emit:(t,d)=>fire(t,d,'me'),presence:p=>Object.assign(ps[0].presence,p)};
}
let room='';
function startNet(host,code,ok,fail){
  const H={ev:{},pc:[]},conns={},pres={};let myid=null,last=[],dirty=false,hc=null;
  const fire=(t,d,from)=>(H.ev[t]||[]).forEach(f=>f({topic:t,data:d,peer:from,isMe:from===myid,sameTab:from===myid}));
  const setPeers=l=>{const ps=l.map(o=>({peer:o.peer,presence:o.presence||{},isMe:o.peer===myid,sameTab:o.peer===myid}));
    const left=last.filter(a=>!ps.find(b=>b.peer===a.peer)),jn=ps.filter(b=>!last.find(a=>a.peer===b.peer));
    last=ps;H.pc.forEach(f=>f({peers:ps,joined:jn,left,updated:[]}))};
  const pub=()=>{if(dirty)return;dirty=true;setTimeout(()=>{dirty=false;const l=Object.keys(pres).map(id=>({peer:id,presence:pres[id]}));
    Object.values(conns).forEach(c=>c.open&&c.send({t:'l',l}));setPeers(l)},50)};
  const bc=(t,d,from)=>{fire(t,d,from);Object.values(conns).forEach(c=>c.open&&c.send({t:'e',k:t,d,from}))};
  const setP=(id,p)=>{pres[id]=Object.assign(pres[id]||{},p);pub()};
  const net={isHost:host,on:(t,f)=>{(H.ev[t]=H.ev[t]||[]).push(f)},onPeers:f=>H.pc.push(f),
    emit:(t,d)=>{if(host)bc(t,d,myid);else if(hc&&hc.open)hc.send({t:'e',k:t,d})},
    presence:p=>{if(host)setP(myid,p);else if(hc&&hc.open)hc.send({t:'p',p})}};
  const pr=new Peer(host?'amg-'+code:undefined);
  pr.on('error',e=>fail(e.type==='unavailable-id'?'الكود مستخدم، جرب مرة ثانية':e.type==='peer-unavailable'?'ما لقيت الغرفة، تأكد من الكود':'مشكلة بالاتصال، جرب مرة ثانية'));
  pr.on('open',id=>{myid=id;
    if(host){pres[id]={};ok()}
    else{hc=pr.connect('amg-'+code,{reliable:true});
      hc.on('open',ok);
      hc.on('data',m=>{if(m.t==='e')fire(m.k,m.d,m.from);else if(m.t==='l')setPeers(m.l)});
      hc.on('close',()=>{$('st').textContent='انقطع الاتصال بالمضيف'})}});
  if(host)pr.on('connection',c=>{
    c.on('open',()=>{conns[c.peer]=c;pres[c.peer]={};pub()});
    c.on('data',m=>{if(m.t==='e')bc(m.k,m.d,c.peer);else if(m.t==='p')setP(c.peer,m.p)});
    c.on('close',()=>{delete conns[c.peer];delete pres[c.peer];pub()})});
  return net;
}

function lobby(){
  ov.className='';ov.replaceChildren();
  ov.append(h('h2','🚀 المحتال'),h('small','لعبة خداع وتصويت بين الطاقم والمحتال'));
  if(!R){
    const i=h('input');i.placeholder='اسمك';i.maxLength=12;i.value=nick;
    const c=h('input');c.placeholder='كود الغرفة';c.maxLength=4;c.inputMode='numeric';
    const msg=h('small','');
    const nn=()=>{nick=i.value.trim().slice(0,12)||'لاعب'};
    const go=host=>{nn();const code=host?String(1000+Math.floor(Math.random()*9000)):c.value.trim();
      if(!/^\d{4}$/.test(code)){msg.textContent='الكود 4 أرقام';return}
      msg.textContent='جاري الاتصال…';
      const to=setTimeout(()=>{if(R&&!joined){R=null;msg.textContent='ما قدرت أتصل. الأونلاين بيشتغل من الملف المحمّل على جهازك.'}},9000);
      R=startNet(host,code,()=>{clearTimeout(to);room=code;joined=true;R.presence({n:nick,c:Math.floor(Math.random()*COL.length),x:900,y:500});$('st').textContent='متصل ✓';wire();lobby()},e=>{clearTimeout(to);R=null;msg.textContent=e})};
    {const cn=h('div',null,'pl');[6,8,10,12].forEach(n=>{const b=h('button',n+' لاعب','vb'+(n===soloN?' sel':''),()=>{soloN=n;[...cn.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});b.style.minWidth='0';cn.append(b)});
    ov.append(i,h('small','🎮 تجربة لحالك مع بوتات (بدون إنترنت) - عدد اللاعبين:'),cn)}
    const s=h('div',null,'pl');s.append(h('button','العب كطاقم','',()=>{nn();startSolo('c')}),h('button','العب كمحتال','k',()=>{nn();startSolo('i')}));
    ov.append(s,h('small','🌐 أونلاين مع صحابك:'));
    const o=h('div',null,'pl');o.append(h('button','أنشئ غرفة','',()=>go(1)),c,h('button','انضم','',()=>go(0)));
    ov.append(o,msg);return}
  const l=h('div',null,'pl');
  named().forEach(p=>{const c=h('div',null,'chip');const d=h('span',null,'dot');d.style.background=COL[p.presence.c||0];c.append(d,h('span',p.presence.n+(p.isMe?' (أنت)':'')));l.append(c)});
  ov.append(h('p','كود الغرفة: '+room),h('small','أعطي الكود لصحابك'),h('p','اللاعبين: '+named().length),l);
  const n=named().length;
  if(R.isHost){const b=h('button','ابدأ اللعبة','',startGame);b.disabled=n<3;ov.append(b);if(n<3)ov.append(h('small','لازم 3 لاعبين على الأقل'))}
  else ov.append(h('small','بانتظار منشئ الغرفة يبدأ اللعبة…'));
}
function startGame(){
  const ids=named().map(p=>p.peer).sort(()=>Math.random()-.5),k=ids.length>=10?3:ids.length>=7?2:1,r={};
  ids.forEach((id,i)=>r[id]=i<k?'i':'c');R.emit('start',{r});
}
function startSolo(role){
  soloRole=role;
  if(!R||!R.local||R.n!==soloN){R=localNet(soloN);R.ps[0].presence.n=nick||'أنت';wire();setupBots()}
  BOTS=R.ps.slice(1).map(p=>({id:p.peer,q:[],wait:0,cd:Date.now()+12000,job:null,tg:null,sus:null}));
  const ids=R.ps.map(p=>p.peer),n=ids.length,k=n>=10?3:n>=7?2:1,r={};ids.forEach(x=>r[x]='c');
  const pool=sh(ids.filter(x=>x!=='me')),imps=role==='i'?['me',...pool.slice(0,k-1)]:pool.slice(0,k);
  imps.forEach(x=>r[x]='i');G=null;R.fire('start',{r},'me');
}
function spawn(){
  const ids=Object.keys(G.roles).sort(),n=ids.length;
  ids.forEach((id,i)=>{const a=i*6.283/n,x=900+Math.cos(a)*115,y=500+Math.sin(a)*115;
    if(id===myId()){my.x=x;my.y=y;R.presence({x,y})}
    else if(R.local){const p=P(id).presence;p.x=x;p.y=y;const b=BOTS.find(b=>b.id===id);if(b){b.q=[];b.wait=0;b.job=null}}})
}
function check(){
  if(!G||G.phase==='end')return;
  const a=alive(),ai=a.filter(p=>G.roles[p]==='i').length,ac=a.length-ai;
  let w=null;if(ai===0)w='c';else if(ai>=ac)w='i';else if(G.done.size>=ST.length)w='c';
  if(w){G.phase='end';G.win=w;showEnd()}
}
function showEnd(){
  ov.className='';ov.replaceChildren();((G.roles[myId()]==='i')===(G.win==='i'))?sfx.win():sfx.lose();
  const imp=Object.keys(G.roles).filter(p=>G.roles[p]==='i').map(nm).join(' و ');
  ov.append(h('h2',G.win==='c'?'🎉 فاز الطاقم':'😈 فاز المحتال'),h('p','المحتال كان: '+imp));
  if(R.local){ov.append(h('button','العب مرة ثانية','',()=>startSolo(soloRole)),h('button','القائمة','vb',()=>location.reload()))}
  else if(R.isHost)ov.append(h('button','جولة جديدة','',startGame));else ov.append(h('small','بانتظار المضيف…'));
}
function showMeet(){
  ov.className='';ov.replaceChildren();
  ov.append(h('h2','🚨 اجتماع'),h('small','ناقشوا ثم صوّتوا. عندكم 30 ثانية.'));
  const l=h('div',null,'pl');
  if(G.dead.has(myId()))ov.append(h('p','أنت خارج اللعبة، تفرّج بس.'));
  else{alive().forEach(p=>{const b=h('button',nm(p),'vb',()=>{if(G.votes[myId()])return;R.emit('vote',{to:p});b.classList.add('sel')});b.style.borderBottom='4px solid '+colr(p);l.append(b)});
    l.append(h('button','تخطّي','vb',e=>{if(G.votes[myId()])return;R.emit('vote',{to:'skip'});e.target.classList.add('sel')}));ov.append(l)}
}
function resolve(){
  if(!G||G.phase!=='meet')return;G.phase='res';
  const t={};Object.values(G.votes).forEach(v=>t[v]=(t[v]||0)+1);
  let best=null,mx=0,tie=false;for(const k in t){if(t[k]>mx){mx=t[k];best=k;tie=false}else if(t[k]===mx)tie=true}
  ov.replaceChildren();let txt='ما حدا انطرد.';
  if(best&&best!=='skip'&&!tie){G.dead.add(best);txt=nm(best)+(G.roles[best]==='i'?' كان المحتال! ✅':' كان بريء ❌')}
  ov.append(h('h2',txt));G.bodies=[];check();
